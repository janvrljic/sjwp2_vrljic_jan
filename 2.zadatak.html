<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <title>Zadatak 2</title>
  </head>
  <body>
    <h1>Zadatak 2</h1>

    <svg width="700" height="550">
      <!-- pozadina -->
      <rect x="40" y="30" width="620" height="490" rx="10" fill="peachpuff" />

      <!-- tlo -->
      <!--M = početna točka / pomak
           L = ravna linija
           A = luk
           Q = zakrivljena linija
           Z = zatvara oblik-->
      <path
        d="M 40 360 Q 350 270 660 360
             L 660 520 L 40 520 Z"
        fill="beige"
      />

      <rect x="150" y="360" width="14" height="90" fill="gray" />

      <polygon points="157,120 95,380 220,380" fill="seagreen" />

      <rect x="275" y="350" width="10" height="70" fill="gray" />

      <polygon points="280,210 245,370 315,370" fill="seagreen" />

      <rect x="485" y="355" width="10" height="65" fill="gray" />

      <polygon points="490,220 455,355 525,355" fill="seagreen" />

      <rect x="585" y="345" width="12" height="80" fill="gray" />

      <polygon points="591,170 540,365 645,365" fill="seagreen" />
    </svg>
  </body>
</html>
