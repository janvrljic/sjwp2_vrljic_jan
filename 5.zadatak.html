<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <title>Zadatak 5</title>
  </head>
  <body>
    <h1>Zadatak 5</h1>

    <svg width="700" height="650">
      <!-- glava -->
      <circle cx="350" cy="170" r="80" fill="peru" />

      <!-- tijelo -->
      <rect x="270" y="230" width="160" height="170" rx="45" fill="peru" />

      <!-- lijeva ruka -->
      <rect x="150" y="235" width="180" height="75" rx="38" fill="peru" />

      <!-- desna ruka -->
      <rect x="370" y="235" width="180" height="75" rx="38" fill="peru" />

      <!-- lijeva noga -->
      <rect
        x="280"
        y="320"
        width="70"
        height="180"
        rx="35"
        fill="peru"
        transform="rotate(15 290 360)"
      />

      <!-- desna noga -->
      <rect
        x="350"
        y="320"
        width="70"
        height="180"
        rx="35"
        fill="peru"
        transform="rotate(-15 410 360)"
      />

      <!-- oči -->
      <circle cx="320" cy="155" r="10" fill="white" />

      <circle cx="380" cy="155" r="10" fill="white" />

      <!-- usta -->
      <rect x="320" y="200" width="60" height="18" rx="9"  fill="white"" />

      <!-- gumbi -->
      <circle cx="350" cy="285" r="15" fill="black" />

      <circle cx="350" cy="345" r="15" fill="black" />
    </svg>
  </body>
</html>
